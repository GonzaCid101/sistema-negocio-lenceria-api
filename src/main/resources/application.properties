spring.application.name=sistema-stock
# === CONEXIÓN A SUPABASE (LA NUBE) ===
spring.datasource.url=jdbc:postgresql://${DB_URL}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA (Hibernate)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad JWT
jwt.secret=${JWT_SECRET}

# === CONFIGURACION ANTI-CORTES PARA SUPABASE (con PgBouncer) ===
# Le dice a Java que verifique si el cable sirve antes de usarlo
spring.datasource.hikari.connection-test-query=SELECT 1
# Renueva los cables viejos cada 1 minuto (PgBouncer tiene timeout de 600s, pero con 60s evitamos conflictos)
spring.datasource.hikari.max-lifetime=60000
# Mantiene la conexión "caliente" enviando latidos cada 30 segundos
spring.datasource.hikari.keepalive-time=30000
# Máximo de conexiones simultáneas (5 es ideal para la capa gratuita de Render)
spring.datasource.hikari.maximum-pool-size=5
# Tiempo máximo de espera si Brasil está lento
spring.datasource.hikari.connection-timeout=20000
# Tiempo máximo que una conexión puede estar idle antes de cerrarse
spring.datasource.hikari.idle-timeout=300000
# Mínimo de conexiones idle mantenidas
spring.datasource.hikari.minimum-idle=2

# === CRITICAL: Deshabilitar prepared statements para PgBouncer ===
# Esto evita el error "prepared statement S_1 already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueriesSize=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# === Detección de fugas de conexión ===
spring.datasource.hikari.leak-detection-threshold=60000

# === Propiedades adicionales de Hibernate para PostgreSQL/Supabase ===
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Evita el N+1 haciendo batch fetching en lugar de N queries individuales
spring.jpa.properties.hibernate.default_batch_fetch_size=100