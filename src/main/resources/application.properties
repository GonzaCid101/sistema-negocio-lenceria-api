spring.application.name=sistema-stock
# === CONEXIÓN A SUPABASE (LA NUBE) ===
spring.datasource.url=jdbc:postgresql://${DB_URL}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA (Hibernate)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad JWT
jwt.secret=${JWT_SECRET}

# === CONFIGURACION ANTI-CORTES PARA SUPABASE ===
# Le dice a Java que verifique si el cable sirve antes de usarlo
spring.datasource.hikari.connection-test-query=SELECT 1
# Renueva los cables viejos cada 2 minutos máximo
spring.datasource.hikari.max-lifetime=120000
# Mantiene la conexión "caliente" enviando latidos cada 30 segundos
spring.datasource.hikari.keepalive-time=30000
# Máximo de conexiones simultáneas (5 es ideal para la capa gratuita de Render)
spring.datasource.hikari.maximum-pool-size=5
# Tiempo máximo de espera si Brasil está lento
spring.datasource.hikari.connection-timeout=20000