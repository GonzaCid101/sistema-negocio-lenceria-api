# =============================================
# CONFIGURACIÓN PARA TESTS (H2 en memoria)
# =============================================

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Deshabilitar SQL logging en tests (opcional - cambiar a true si necesitas debug)
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret para tests (debe tener al menos 256 bits para HS256)
jwt.secret=test-secret-key-muy-larga-para-tests-jwt-spring-boot-32-bytes-minimo-requerido

# Deshabilitar seguridad en tests de integración (opcional)
# spring.security.enabled=false
